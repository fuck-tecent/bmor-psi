[Service]
EnvironmentFile=/etc/goldbach-ci/production-release.env
ExecStart=
ExecStart=/usr/bin/python3 -B /opt/goldbach-ci/controller/dispatch_cycle.py --database /var/lib/goldbach-ci-webhook/deliveries.db --github-key %d/github-app.pem --jenkins-url http://127.0.0.1:18080 --jenkins-user goldbach-admin --jenkins-credential %d/jenkins-password --jobs /opt/goldbach-ci/controller/jobs-production.json --site-input-root /opt/goldbach-ci --first-job-id ${GOLDBACH_CI_FIRST_PRODUCTION_JOB} --first-formal-job-id ${GOLDBACH_CI_FIRST_FORMAL_JOB}
