name: Website release verification
on:
  pull_request:
    paths: ['deploy/**', '.github/workflows/site-release.yml']
  push:
    branches: [main]
    paths: ['deploy/**', '.github/workflows/site-release.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the site image dependency
        run: python -m pip install 'Pillow>=12,<13'
      - name: Verify site modules and research services
        run: bash deploy/jenkins/check-site.sh
