[Service]
EnvironmentFile=/etc/goldbach-ci/production-release.env
StateDirectory=
StateDirectory=goldbach-ci-production-checks
ExecStart=
ExecStart=/usr/bin/python3 -B /opt/goldbach-ci/controller/build_checks.py --jobs-db /var/lib/goldbach-ci-webhook/deliveries.db --outbox /var/lib/goldbach-ci-production-checks/checks.db --private-key %d/github-app.pem --first-job-id ${GOLDBACH_CI_FIRST_PRODUCTION_JOB}
