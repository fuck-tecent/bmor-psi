<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #152820; background: #eeece2; font: 17px/1.65 "Microsoft YaHei", "PingFang SC", sans-serif; }
    .report { max-width: 1080px; margin: auto; background: #f5f2e7; }
    header {
      padding: 50px 64px 48px;
      color: #f8f2dc;
      background: radial-gradient(ellipse at 93% 15%, #2f5040 0%, transparent 55%), #152820;
    }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand img { display: block; width: 68px; height: 68px; }
    time { color: #ead4a4; font-size: 15px; }
    h1, h2 { font-family: "Songti SC", "Noto Serif CJK SC", SimSun, Georgia, serif; line-height: 1.25; }
    h1 { font-size: clamp(34px, 6vw, 58px); margin: 30px 0 16px; letter-spacing: -.03em; }
    header p { color: #e2dfcd; max-width: 760px; margin: 0; }
    main { padding: 36px 64px 26px; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    article { min-width: 0; border: 1px solid #dad3be; border-radius: 12px; padding: 22px 25px; background: #fffcf3; }
    article:first-child { grid-column: 1 / -1; border-left: 5px solid #aa7831; }
    .track, .sources { font-size: 14px; font-weight: 700; color: #785018; }
    h2 { font-size: 28px; margin: 7px 0 9px; }
    article p { margin: 0; overflow-wrap: anywhere; }
    .scope { color: #46534a; font-size: 15px; margin-top: 7px; }
    .sources { margin-top: 11px; }
    .note { font-size: 14px; color: #46534a; margin: 19px 0 0; }
    footer {
      margin: 0 64px;
      padding: 18px 0 25px;
      border-top: 1px solid #cec5ac;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    footer strong { display: block; font-size: 19px; }
    footer img { display: block; width: auto; height: auto; max-width: 180px; image-rendering: pixelated; }
    a { color: inherit; text-underline-offset: 3px; }
    footer a { overflow-wrap: anywhere; }
    @media (max-width: 650px) {
      header { padding: 24px; }
      main { padding: 20px 16px; }
      .cards { grid-template-columns: minmax(0, 1fr); }
      footer { margin: 0 16px; font-size: 14px; }
      footer img { max-width: 120px; }
    }
  </style>
</head>
<body>
  <div class="report">
    <header>
      <div class="brand">
        <img src="$logo" alt="哥德巴赫研究台 Logo">
        <time>$date</time>
      </div>
      <h1>$title</h1>
      <p>$summary</p>
    </header>
    <main>
      <div class="cards">$cards</div>
      $note
    </main>
    <footer>
      <div>
        <strong>扫码访问研究台</strong>
        <a href="$url">$url</a>
      </div>
      <a href="$url"><img src="$qr" alt="研究台网址二维码"></a>
    </footer>
  </div>
</body>
</html>
